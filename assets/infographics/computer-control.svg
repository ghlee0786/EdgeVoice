<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <!-- 브라우저·컴퓨터 조작: 말 → 도구 고르기 → 크롬(유튜브·광고 건너뛰기·닫기) / 그림판. 세 갈래가 차례로 켜진다 -->
  <style>
    .box { fill: #1f2430; stroke: #3a4150; stroke-width: 2; }
    .t { fill: #f4f4f5; font-size: 17px; font-weight: 700; }
    .s { fill: #a1a1aa; font-size: 13px; }
    .say { fill: #1e3a8a; }
    .arrow { stroke: #71717a; stroke-width: 3; fill: none; marker-end: url(#head); }
    .lane { opacity: 0.35; animation: lane 9s infinite; }
    .l2 { animation-delay: 3s; } .l3 { animation-delay: 6s; }
    @keyframes lane { 0% { opacity: 0.35; } 4%, 30% { opacity: 1; } 34%, 100% { opacity: 0.35; } }
    /* 움직임 줄이기(설치 마법사용 정지 그림도 이것으로 찍는다): 세 갈래를 모두 켠다 */
    @media (prefers-reduced-motion: reduce) { .lane { animation: none; opacity: 1; } }
    .skip { animation: skip 3s infinite; }
    @keyframes skip { 0%, 40% { fill: #3f3f46; } 55%, 100% { fill: #22c55e; } }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#71717a"/>
    </marker>
  </defs>
  <rect width="960" height="330" rx="18" fill="#111318"/>
  <text x="24" y="36" fill="#e4e4e7" font-size="18" font-weight="700">말로 시키는 브라우저·컴퓨터 조작</text>

  <!-- 도구 고르기 -->
  <g transform="translate(300 128)"><rect class="box" width="150" height="80" rx="14"/>
    <text class="t" x="75" y="35" text-anchor="middle">도구 고르기</text>
    <text class="s" x="75" y="57" text-anchor="middle">LLM + 핵심어</text></g>

  <!-- 1. 유튜브 -->
  <g class="lane">
    <g transform="translate(24 58)"><rect class="say" width="240" height="56" rx="28"/>
      <text x="120" y="34" fill="#dbeafe" font-size="15" text-anchor="middle">"유튜브에서 피아노 틀어 줘"</text></g>
    <path class="arrow" d="M264 86C285 86 280 150 296 155"/>
    <g transform="translate(500 50)"><rect class="box" width="436" height="72" rx="14"/>
      <rect x="18" y="16" width="58" height="40" rx="9" fill="#dc2626"/><path d="M40 26l16 10-16 10z" fill="#fff"/>
      <text class="t" x="92" y="33">play_youtube</text>
      <text class="s" x="92" y="54">크롬에서 찾아 첫 영상 재생</text>
      <rect class="skip" x="306" y="20" width="112" height="32" rx="6"/>
      <text x="362" y="41" fill="#fff" font-size="13" text-anchor="middle">광고 건너뛰기 ▶</text></g>
    <path class="arrow" d="M452 160C475 160 470 86 496 86"/>
  </g>
  <!-- 2. 크롬 닫기 -->
  <g class="lane l2">
    <g transform="translate(24 140)"><rect class="say" width="240" height="56" rx="28"/>
      <text x="120" y="34" fill="#dbeafe" font-size="15" text-anchor="middle">"크롬 꺼 줘"</text></g>
    <path class="arrow" d="M264 168H296"/>
    <g transform="translate(500 132)"><rect class="box" width="436" height="72" rx="14"/>
      <circle cx="47" cy="36" r="20" fill="#3f3f46"/><path d="M38 27l18 18M56 27l-18 18" stroke="#fff" stroke-width="4"/>
      <text class="t" x="92" y="33">close_browser</text>
      <text class="s" x="92" y="54">재생을 멈추고 크롬 창을 닫음</text></g>
    <path class="arrow" d="M452 168H496"/>
  </g>
  <!-- 3. 그림판 -->
  <g class="lane l3">
    <g transform="translate(24 222)"><rect class="say" width="240" height="56" rx="28"/>
      <text x="120" y="34" fill="#dbeafe" font-size="15" text-anchor="middle">"그림판에 집 그려 줘"</text></g>
    <path class="arrow" d="M264 250C285 250 280 186 296 181"/>
    <g transform="translate(500 214)"><rect class="box" width="436" height="72" rx="14"/>
      <rect x="18" y="14" width="58" height="44" rx="6" fill="#fafafa"/>
      <path d="M33 50V36l14-10 14 10v14z" fill="none" stroke="#2563eb" stroke-width="3"/>
      <text class="t" x="92" y="33">draw_picture</text>
      <text class="s" x="92" y="54">그림판을 열고 마우스로 그림</text></g>
    <path class="arrow" d="M452 176C475 176 470 250 496 250"/>
  </g>
  <text x="480" y="314" fill="#71717a" font-size="13" text-anchor="middle">맞는 도구가 연결되어 있지 않으면 했다고 꾸미지 않고 "할 수 없다" 고 답합니다</text>
</svg>
