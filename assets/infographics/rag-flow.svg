<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <!-- 지식(RAG): 올린 문서를 조각내 임베딩해 두고, 질문과 가까운 조각을 근거로 답한다 -->
  <style>
    .box { fill: #1f2430; stroke: #3a4150; stroke-width: 2; }
    .t { fill: #f4f4f5; font-size: 19px; font-weight: 700; text-anchor: middle; }
    .s { fill: #a1a1aa; font-size: 13px; text-anchor: middle; }
    .arrow { stroke: #71717a; stroke-width: 3; fill: none; marker-end: url(#head); stroke-dasharray: 8 8; animation: dash 1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -16; } }
    .chunk { fill: #f59e0b; animation: blink 3s infinite; }
    .c2 { animation-delay: 0.3s; } .c3 { animation-delay: 0.6s; } .c4 { animation-delay: 0.9s; }
    @keyframes blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    .hit { fill: #22c55e; animation: hit 3s infinite; }
    @keyframes hit { 0%, 40% { opacity: 0.2; } 60%, 90% { opacity: 1; } 100% { opacity: 0.2; } }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#71717a"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="18" fill="#111318"/>
  <text x="30" y="38" fill="#e4e4e7" font-size="18" font-weight="700">지식(RAG) 흐름</text>

  <!-- 문서 -->
  <g transform="translate(30 70)"><rect class="box" width="150" height="120" rx="14"/>
    <path d="M55 22h30l14 14v44h-44z" fill="#e4e4e7"/><path d="M85 22v14h14" fill="#a1a1aa"/>
    <text class="t" x="75" y="104">문서</text></g>
  <!-- 조각 -->
  <g transform="translate(220 70)"><rect class="box" width="150" height="120" rx="14"/>
    <rect class="chunk" x="35" y="20" width="80" height="12" rx="3"/>
    <rect class="chunk c2" x="35" y="38" width="80" height="12" rx="3"/>
    <rect class="chunk c3" x="35" y="56" width="80" height="12" rx="3"/>
    <rect class="chunk c4" x="35" y="74" width="80" height="12" rx="3"/>
    <text class="t" x="75" y="108">조각</text></g>
  <!-- 임베딩 -->
  <g transform="translate(410 70)"><rect class="box" width="150" height="120" rx="14"/>
    <text x="75" y="56" fill="#a78bfa" font-size="17" text-anchor="middle" font-family="monospace">[0.12, -0.4,</text>
    <text x="75" y="76" fill="#a78bfa" font-size="17" text-anchor="middle" font-family="monospace"> 0.88, …]</text>
    <text class="t" x="75" y="108">임베딩</text></g>
  <!-- 검색 -->
  <g transform="translate(600 70)"><rect class="box" width="150" height="120" rx="14"/>
    <circle cx="68" cy="48" r="20" fill="none" stroke="#e4e4e7" stroke-width="5"/><path d="M83 63l18 18" stroke="#e4e4e7" stroke-width="6" stroke-linecap="round"/>
    <text class="t" x="75" y="108">검색</text></g>
  <!-- 근거 있는 답 -->
  <g transform="translate(790 70)"><rect class="box" width="140" height="120" rx="14"/>
    <rect class="hit" x="25" y="22" width="90" height="12" rx="3"/>
    <rect x="25" y="40" width="70" height="10" rx="3" fill="#52525b"/>
    <rect x="25" y="56" width="80" height="10" rx="3" fill="#52525b"/>
    <text class="t" x="70" y="104">근거로 답</text></g>
  <path class="arrow" d="M182 130H216"/><path class="arrow" d="M372 130H406"/><path class="arrow" d="M562 130H596"/><path class="arrow" d="M752 130H786"/>

  <text class="s" x="105" y="222">PDF·DOCX·PPTX·TXT·MD</text>
  <text class="s" x="295" y="222">256자씩, 문장 끝에서</text>
  <text class="s" x="485" y="222">bge-m3 · pgvector</text>
  <text class="s" x="675" y="222">질문과 가까운 조각</text>
  <text class="s" x="860" y="222">답 아래 출처 표시</text>
  <text x="480" y="270" fill="#71717a" font-size="14" text-anchor="middle">모든 처리는 이 PC·서버 안에서 — 문서가 밖으로 나가지 않습니다</text>
</svg>
