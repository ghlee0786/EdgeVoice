name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    name: Desktop agent (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test clients/dotnet/EdgeVoice.Agent.sln -c Release
      # 태그 v1.2.3 → 1.2.3 (앱 버전 = 자동 업데이트가 비교하는 값, 설치 프로그램 이름)
      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v').Split('-')[0]
          "version=$v" >> $env:GITHUB_OUTPUT
      # Inno Setup 설치 프로그램 (앱의 자동 업데이트가 이 EdgeVoice-Setup-*.exe 자산을 받는다)
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      # publish(-p:Version) + ISCC — ci.yml 과 같은 스크립트
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version ${{ steps.ver.outputs.version }}
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath EdgeVoice.Agent-${{ github.ref_name }}-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            EdgeVoice.Agent-${{ github.ref_name }}-win-x64.zip
            clients/dotnet/installer/Output/EdgeVoice-Setup-${{ steps.ver.outputs.version }}.exe
          generate_release_notes: true

  images:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, rag, orchestrator, wake_word, audio_gateway, embedding, stt, tts]
    steps:
      - name: Free disk space (CUDA images)
        if: matrix.service == 'stt' || matrix.service == 'tts' || matrix.service == 'embedding'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/edgevoice-${SERVICE//_/-}" >> "$GITHUB_OUTPUT"
        env:
          SERVICE: ${{ matrix.service }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
