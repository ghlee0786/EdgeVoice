name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build clients/dotnet/EdgeVoice.Agent.sln -c Release
      - run: dotnet test clients/dotnet/EdgeVoice.Agent.sln -c Release --no-build

  installer:
    name: installer (Inno Setup) · PowerShell 구문
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # deploy/*.ps1 · scripts/*.ps1 — Windows PowerShell 5.1 (설치된 PC 가 쓰는 것) 과 PowerShell 7 둘 다
      - name: PowerShell syntax (5.1)
        shell: powershell
        run: ./scripts/check-powershell.ps1
      - name: PowerShell syntax (7)
        shell: pwsh
        run: ./scripts/check-powershell.ps1
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      # release.yml 과 같은 스크립트 — .iss · assets/installer · deploy 가 깨지면 여기서 실패한다
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version 0.0.0

  deploy-compose:
    name: deploy compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config --quiet

  python:
    name: pytest ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 폴더를 섞어 돌리면 서비스별 app 패키지가 서로 간섭하므로 폴더마다 따로 실행한다
        suite: [orchestrator, shared, rag, llm, stt, tts, deploy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest tests/${{ matrix.suite }} -q -p no:cacheprovider

  lint:
    name: ruff (changed files)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # 저장소 전체 린트는 기존부터 실패하므로 PR 에서 바뀐 Python 파일만 검사한다
      - run: |
          files=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -- '*.py')
          if [ -n "$files" ]; then ruff check $files; else echo "no python changes"; fi

  docker:
    name: docker build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CUDA 기반(stt, tts)과 torch 를 받는 embedding 은 이미지가 커서 릴리스에서만 빌드한다
        service: [backend, rag, orchestrator, wake_word, audio_gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
